name: iOS Frameworks

# The Go cores the NetworkExtension needs, in one framework.
#
# They cannot be two frameworks: each gomobile bind carries its own copy of the
# cgo bootstrap and the gomobile seq layer, so linking two of them into one
# extension fails with dozens of duplicate symbols. See build-cores-ios.sh.
#
# It changes only when the pinned versions change, and macOS runners bill at
# 10x — so this never runs on push. Build once per version, publish, and let
# every other build download the result instead of paying for it again.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Attach the result to the ios-cores release tag
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: ios-frameworks
  cancel-in-progress: false

env:
  # 1.13 is not a preference, it is the only line that fits. libXray pulls
  # apernet/quic-go, which needs quic-go/qpack v0.6.0; sing-box only reaches
  # qpack v0.6.0 in 1.13 (1.11 wants v0.4.0, 1.12 v0.5.1, and v0.6.0 renamed
  # the decoder API). Pairing either of those with libXray fails to compile.
  SINGBOX_VERSION: 1.13.14
  # Pinned, not `latest`: this is what the combined module was verified to
  # resolve and compile against, alongside sing-box 1.13.14.
  LIBXRAY_VERSION: v1.260711.0

jobs:
  build:
    name: gomobile bind (sing-box + Xray)
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v7
        with:
          # libXray requires a modern toolchain, and the sagernet gomobile fork
          # builds on one now — so unlike before, both fit in a single job.
          go-version: stable

      - name: Cache built framework
        id: cache
        uses: actions/cache@v4
        with:
          path: dist/frameworks
          key: ios-cores-sb${{ env.SINGBOX_VERSION }}-lx${{ env.LIBXRAY_VERSION }}-${{ hashFiles('scripts/build-cores-ios.sh') }}

      - name: Build Cores
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash scripts/build-cores-ios.sh "$PWD/dist/frameworks"

      - name: Report what was produced
        run: |
          echo "### iOS cores" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          du -sh dist/frameworks/* 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || echo "nothing built" >> "$GITHUB_STEP_SUMMARY"
          ls -1 dist/frameworks/Cores.xcframework/ios-arm64/Cores.framework/Headers >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Package
        run: |
          cd dist/frameworks
          zip -qry ../Cores-ios.zip Cores.xcframework
          ls -la ../

      - uses: actions/upload-artifact@v4
        with:
          name: ios-cores
          path: dist/*.zip
          if-no-files-found: error

      # A release asset outlives the 90-day artifact retention, so the extension
      # build can fetch a known framework months later without a macOS runner.
      - name: Publish to the ios-cores tag
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="ios-cores-sb${SINGBOX_VERSION}-lx${LIBXRAY_VERSION}"
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --prerelease --notes "sing-box ${SINGBOX_VERSION} + libXray ${LIBXRAY_VERSION} bound into one framework for the iOS NetworkExtension."
          gh release upload "$tag" dist/*.zip --clobber
