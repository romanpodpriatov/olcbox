name: PR Checks

# Pull requests, and every push to a branch that is not main.
#
# On pull_request alone, work pushed to a branch was compiled by nothing until
# somebody opened a PR — so a branch could sit for a day looking finished while
# not building at all. This is the cheap half of the pipeline (one ubuntu
# runner), and the expensive half stays where it is: `Build ProofKit Releases`
# is workflow_dispatch only, on purpose, because macOS minutes bill at 10x.
#
# main is excluded because a push there is a merge of something already checked.
on:
  pull_request:
    branches:
      - main
  push:
    branches-ignore:
      - main

permissions:
  contents: read

concurrency:
  # A push carries no PR number, and without the ref every branch would share
  # one group and cancel the others' runs.
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Gradle checks
    runs-on: ubuntu-latest

    env:
      ANDROID_NDK_VERSION: "28.2.13676358"
      # crypt1/admin secrets (baked into GeneratedAppInfo). Absent on fork PRs ⇒
      # features compile but stay disabled; jvmTest uses its own explicit key.
      OLCBOX_CRYPT_KEY_V1: ${{ secrets.OLCBOX_CRYPT_KEY_V1 }}
      OLCBOX_ADMIN_PASS_SHA256: ${{ secrets.OLCBOX_ADMIN_PASS_SHA256 }}

    steps:
      - name: Checkout olcbox
        uses: actions/checkout@v7
        with:
          path: olcbox

      - name: Checkout olcrtc
        uses: actions/checkout@v7
        with:
          repository: romanpodpriatov/olcrtc
          ref: proofkit-udp-spike
          path: olcrtc
          submodules: recursive

      - name: Setup JDK
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          cache-dependency-path: olcrtc/go.sum

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;${ANDROID_NDK_VERSION}"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Go mobile tooling
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install github.com/magefile/mage@latest

      - name: Initialize gomobile
        working-directory: olcrtc
        run: |
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          export ANDROID_NDK_ROOT="${ANDROID_NDK_HOME}"
          gomobile init

      - name: Run checks
        working-directory: olcbox
        run: |
          export OLCRTC_REPO="${{ github.workspace }}/olcrtc"
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          export ANDROID_NDK_ROOT="${ANDROID_NDK_HOME}"
          ./gradlew :sharedUI:jvmTest :desktopApp:compileKotlin :androidApp:assembleDebug --stacktrace
